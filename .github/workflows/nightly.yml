name: Nightly

on:
  workflow_dispatch:
  schedule:
    - cron: '47 2 * * *'

concurrency:
  group: nightly
  cancel-in-progress: false

permissions: {}

env:
  IMAGE: ghcr.io/rapla/rapla

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      sha: ${{ steps.src.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: rapla/rapla
          ref: master
          path: rapla
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Build rapla.jar
        working-directory: rapla
        run: mvn -B clean package -DskipTests -Psign-jks
      - name: Build metadata
        id: src
        run: |
          sha=$(git -C rapla rev-parse HEAD)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "unexpected commit sha: $sha"; exit 1; }
          manifest=$(unzip -p rapla/rapla-app/target/rapla.jar META-INF/MANIFEST.MF | tr -d '\r')
          version=$(sed -n 's/^Implementation-Version: //p' <<<"$manifest")
          buildtime=$(sed -n 's/^Build-Time: \(.*\) GMT+0$/\1/p' <<<"$manifest")
          [[ -n "$version" && -n "$buildtime" ]] || { echo "manifest lacks Implementation-Version or Build-Time"; exit 1; }
          created=$(date -u -d "$buildtime" +%Y-%m-%dT%H:%M:%SZ)
          {
            echo "sha=$sha"
            echo "version=$version"
            echo "created=$created"
          } >> "$GITHUB_OUTPUT"
      - name: Build image
        working-directory: rapla
        env:
          REVISION: ${{ steps.src.outputs.sha }}
          VERSION: ${{ steps.src.outputs.version }}
          CREATED: ${{ steps.src.outputs.created }}
        run: |
          docker build -t "$IMAGE:nightly" \
            --label "org.opencontainers.image.revision=$REVISION" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.created=$CREATED" \
            .
          docker save "$IMAGE:nightly" -o ../image.tar
          cp rapla-app/target/rapla.jar ../rapla.jar
      - uses: actions/upload-artifact@v7
        with:
          name: nightly
          path: |
            rapla.jar
            image.tar
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nightly
          path: dist
      - name: Attest rapla.jar
        uses: actions/attest@v4
        with:
          subject-path: dist/rapla.jar
      - name: Update nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.build.outputs.sha }}
        run: |
          cat > notes.md <<EOF
          Nightly test build of rapla/rapla master at [${SHA::9}](https://github.com/rapla/rapla/commit/$SHA), built $(date -u '+%Y-%m-%d %H:%M UTC') ([run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})).

          Self-signed with the public dev certificate (raplaselfsigned.ks) - not for production.

          Docker: \`docker pull ghcr.io/rapla/rapla:nightly\`

          Verify: gh attestation verify rapla.jar --repo rapla/rapla-releases --signer-workflow rapla/rapla-releases/.github/workflows/nightly.yml --source-ref refs/heads/main

          Verify image: gh attestation verify oci://ghcr.io/rapla/rapla:nightly --repo rapla/rapla-releases --signer-workflow rapla/rapla-releases/.github/workflows/nightly.yml --source-ref refs/heads/main
          EOF
          if ! gh release view nightly >/dev/null 2>&1; then
            gh release create nightly --prerelease --target main --title "Nightly build" --notes-file notes.md
          fi
          gh release edit nightly --prerelease --notes-file notes.md
          gh release upload nightly dist/rapla.jar --clobber
      - name: Push image
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docker load -i dist/image.tar
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:nightly"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:nightly")
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"
      - name: Attest image
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Delete untagged image versions older than 10 days
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cutoff=$(date -u -d '10 days ago' +%Y-%m-%dT%H:%M:%SZ)
          versions="orgs/rapla/packages/container/rapla/versions"
          gh api --paginate "$versions" \
            --jq ".[] | select((.metadata.container.tags | length) == 0 and .created_at < \"$cutoff\") | .id" |
            while read -r id; do
              gh api -X DELETE "$versions/$id"
              echo "deleted version $id"
            done
